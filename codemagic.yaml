
workflows:
  myspoti-android:
    name: Myspoti Android APK
    max_build_duration: 60
    instance_type: linux_x2

    scripts:
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/base/local.properties"

      - name: Build Myspoti APK
        script: |
          cd base
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - base/**/build/outputs/**/*.apk
